# Render Blueprint (https://render.com/docs/blueprint-spec) — DoorSignal judge sandbox.
# Replay mode serves responses recorded from the real Ring Developer Playground,
# because Playground tokens expire after ~30 minutes.
services:
  - type: web
    name: doorsignal
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/status
    envVars:
      - key: DOORSIGNAL_MODE
        value: replay
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RING_HMAC_KEY
        generateValue: true
      - key: IMAGE_TTL_MIN
        value: "60"
      # Amazon Bedrock image descriptions (docs/aws-bedrock.md): set to "on" with a Bedrock API key.
      - key: BEDROCK_DESCRIPTIONS
        sync: false
      - key: AWS_BEARER_TOKEN_BEDROCK
        sync: false
      - key: AWS_REGION
        value: us-east-1
