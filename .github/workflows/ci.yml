name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  firetv:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: firetv } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # ubuntu-latest ships an Android SDK (ANDROID_HOME); setup-android@v3 fails installing the removed 'tools' package.
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: doorsignal-firetv-debug-apk, path: firetv/app/build/outputs/apk/debug/app-debug.apk }

  docker:
    # Builds the same image Render builds and runs it the way Render does (PORT=10000, replay mode).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t doorsignal .
      - run: |
          # Throwaway admin password for this ephemeral container only; masked in logs.
          pw=$(openssl rand -hex 16); echo "::add-mask::$pw"; echo "DS_PW=$pw" >> "$GITHUB_ENV"
          docker run -d --name ds -p 10000:10000 -e PORT=10000 -e DOORSIGNAL_MODE=replay \
            -e ADMIN_PASSWORD="$pw" -e SESSION_SECRET=ci-secret -e RING_HMAC_KEY=ci-key doorsignal
          for i in $(seq 1 30); do curl -sf http://localhost:10000/api/status >/dev/null && break; sleep 1; done
          curl -sf http://localhost:10000/api/status | tee status.json
          grep -q '"mode":"replay"' status.json
          grep -q '"available":true' status.json
          curl -sf -o /dev/null http://localhost:10000/tv
          curl -sf -X POST http://localhost:10000/api/sim/button_press | tee sim.json
          grep -q '"status":"accepted"' sim.json
          sleep 2
          url=$(curl -sf http://localhost:10000/api/events | python3 -c 'import json,sys; print(json.load(sys.stdin)["events"][0]["image_url"])')
          curl -sf -o img.jpg -w '%{http_code} %{content_type} %{size_download}\n' "http://localhost:10000$url"
          file img.jpg | grep -q JPEG
          curl -sf -o pub.jpg http://localhost:10000/screens/tv-alert.jpg && file pub.jpg | grep -q JPEG
          curl -sf http://localhost:10000/ | grep -q 'DoorSignal'
      # Full TV workflow in a real browser against the production image: pair /tv via /console,
      # simulated press, alert with the recorded Playground image, Enter clears.
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: server
      - run: npm run test:deployed
        working-directory: server
        env: { DEPLOYED_URL: 'http://localhost:10000', DEPLOYED_ADMIN_PASSWORD: '${{ env.DS_PW }}' }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: tv-workflow-docker-report, path: server/playwright-report/deployed }
      - if: always()
        run: docker logs ds || true

  render:
    # The same spec against the live Render deployment. Render deploys after a push, so this checks
    # whatever is live at the time. The full TV test needs the DEPLOYED_ADMIN_PASSWORD repository
    # secret; without it that test is skipped and reported as skipped.
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npm run test:deployed
        env:
          DEPLOYED_URL: https://amaz-1r9h.onrender.com
          DEPLOYED_ADMIN_PASSWORD: ${{ secrets.DEPLOYED_ADMIN_PASSWORD }}
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: tv-workflow-render-report, path: server/playwright-report/deployed }
