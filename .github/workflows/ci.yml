name: ci
on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  firetv:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: firetv } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # ubuntu-latest ships an Android SDK (ANDROID_HOME); setup-android@v3 fails installing the removed 'tools' package.
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: doorsignal-firetv-debug-apk, path: firetv/app/build/outputs/apk/debug/app-debug.apk }

  docker:
    # Builds the same image Render builds and runs it the way Render does (PORT=10000, replay mode).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t doorsignal .
      - run: |
          docker run -d --name ds -p 10000:10000 -e PORT=10000 -e DOORSIGNAL_MODE=replay \
            -e ADMIN_PASSWORD=ci -e SESSION_SECRET=ci-secret -e RING_HMAC_KEY=ci-key doorsignal
          for i in $(seq 1 30); do curl -sf http://localhost:10000/api/status >/dev/null && break; sleep 1; done
          curl -sf http://localhost:10000/api/status | tee status.json
          grep -q '"mode":"replay"' status.json
          grep -q '"available":true' status.json
          curl -sf -o /dev/null http://localhost:10000/tv
          curl -sf -X POST http://localhost:10000/api/sim/button_press | tee sim.json
          grep -q '"status":"accepted"' sim.json
          sleep 2
          url=$(curl -sf http://localhost:10000/api/events | python3 -c 'import json,sys; print(json.load(sys.stdin)["events"][0]["image_url"])')
          curl -sf -o img.jpg -w '%{http_code} %{content_type} %{size_download}\n' "http://localhost:10000$url"
          file img.jpg | grep -q JPEG
      - if: always()
        run: docker logs ds || true
